services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: library-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: LibraryAdmin2026
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "system/LibraryAdmin2026@//localhost:1521/FREEPDB1", "@/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 15

volumes:
  oracle-data: